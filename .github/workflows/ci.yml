name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e '.[test,nd-config,dev]'
      - run: python scripts/check_hygiene.py
      - run: python -m compileall -q src/versum
      - run: ruff check --select E9,F63,F7,F82 src/versum tests scripts
      - run: mypy src/versum/loomground.py src/versum/write.py
      - run: pytest -q

  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - run: python scripts/check_register.py

  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build==1.4.0"
      - run: python tools/supply_chain_gate.py --self-test
      - run: python tools/supply_chain_gate.py
      - run: python -m build
      - run: python -m venv /tmp/versum-smoke
      - run: /tmp/versum-smoke/bin/pip install -r requirements-dev.txt
      - run: /tmp/versum-smoke/bin/pip install dist/*.whl
      - run: /tmp/versum-smoke/bin/python scripts/smoke_installed.py
