name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5  # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    # Skipped until a PyPI trusted publisher exists for this repo: set the
    # repository variable PYPI_PUBLISHING to 'enabled' after configuring
    # pypi.org (owner flxk1, repo loomground-versum, workflow
    # release-please.yml, environment pypi).
    if: ${{ needs.release.outputs.release-created == 'true' && vars.PYPI_PUBLISHING == 'enabled' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/loomground-versum
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest==9.1.1" "build==1.4.0"
      # loomground-versum depends on loomground-governance>=0.8,<0.9, which is not
      # yet published to PyPI. requirements-dev.txt pins the same range to a
      # tagged Git release so the range is already satisfied before `pip install .`
      # tries to resolve it from an index.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .
      - run: python tools/supply_chain_gate.py --self-test
      - run: python tools/supply_chain_gate.py
      - run: python -m pytest -q
      - name: build sdist and wheel once
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
